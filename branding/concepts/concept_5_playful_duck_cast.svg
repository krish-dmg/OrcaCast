<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg_dark5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="yellow_duck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cyan_beam5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg_dark5)"/>

  <!-- Minimalist Matte Screen Container Frame -->
  <rect x="232" y="240" width="560" height="390" rx="44" fill="#0f1115" stroke="#27272a" stroke-width="18"/>

  <!-- Monitor Base -->
  <path d="M 442 630 L 422 710 L 602 710 L 582 630" fill="#27272a"/>
  <rect x="372" y="710" width="280" height="16" rx="8" fill="#3f3f46"/>

  <!-- Floating Minimalist Duck Avatar Wearing An Orca Mask/Hood -->
  <!-- Cute Smooth Duck Head Circle -->
  <circle cx="440" cy="435" r="95" fill="url(#yellow_duck)"/>

  <!-- Sleek Orca Fin Cap / Hood on Duck's Head -->
  <path d="M 390 350 C 410 270 445 220 460 210 C 465 260 460 320 440 350 Z" fill="#ffffff"/>

  <!-- Duck Beak pointing directly toward transmission signal -->
  <path d="M 505 425 L 590 425 C 602 425 605 440 592 448 L 505 465 Z" fill="#f97316"/>

  <!-- Friendly Eye Dot -->
  <circle cx="465" cy="405" r="12" fill="#09090b"/>

  <!-- Orca White Eye-Patch Decal across the top -->
  <ellipse cx="410" cy="385" rx="26" ry="14" transform="rotate(-25 410 385)" fill="#ffffff"/>

  <!-- High-Power Casting Wave Pulses emitted out of the display -->
  <path d="M 640 370 A 90 90 0 0 1 640 500" fill="none" stroke="url(#cyan_beam5)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 700 325 A 160 160 0 0 1 700 545" fill="none" stroke="url(#cyan_beam5)" stroke-width="24" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 760 280 A 230 230 0 0 1 760 590" fill="none" stroke="url(#cyan_beam5)" stroke-width="24" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
