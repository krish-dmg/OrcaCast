<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="border1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg1)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="url(#border1)" stroke-width="4"/>

  <!-- Iconic Orca Dorsal Fin silhouette -->
  <path d="M 280 720 C 380 720 440 640 480 480 C 510 360 520 220 500 180 C 490 280 400 460 300 580 C 260 628 240 680 280 720 Z" fill="#ffffff"/>

  <!-- Forward-Radiating Broadcast Waves emitted from the dorsal crest -->
  <!-- Wave 1 (inner) -->
  <path d="M 580 320 A 180 180 0 0 1 580 540" fill="none" stroke="url(#wave1)" stroke-width="32" stroke-linecap="round"/>
  <!-- Wave 2 (middle) -->
  <path d="M 660 250 A 280 280 0 0 1 660 610" fill="none" stroke="url(#wave1)" stroke-width="32" stroke-linecap="round" stroke-opacity="0.8"/>
  <!-- Wave 3 (outer) -->
  <path d="M 740 180 A 380 380 0 0 1 740 680" fill="none" stroke="url(#wave1)" stroke-width="32" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Sleek Saddle Patch Accent -->
  <path d="M 330 650 C 380 630 420 620 460 630 C 440 660 410 680 360 685 Z" fill="#94a3b8" fill-opacity="0.4"/>
</svg>
