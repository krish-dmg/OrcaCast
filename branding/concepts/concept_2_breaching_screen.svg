  <path d="M 460 640 L 440 730 L 584 730 L 564 640" fill="#1e293b"/>
  <rect x="382" y="730" width="260" height="16" rx="8" fill="#334155"/>

  <!-- The Fin Breaking The Screen Horizon (3D Illusion / Pure Minimalism) -->
