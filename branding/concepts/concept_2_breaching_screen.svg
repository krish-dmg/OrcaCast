  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg_deep)"/>

  <!-- Sleek Modern Floating Display Screen (16:10 Ratio) -->
  <rect x="200" y="220" width="624" height="420" rx="40" fill="#131b2e" stroke="#1e293b" stroke-width="16"/>

