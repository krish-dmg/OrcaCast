  <path d="M 330 550 C 420 545 470 480 500 370 C 525 270 535 160 520 120 C 505 220 440 370 340 470 C 305 505 300 540 330 550 Z" fill="#ffffff"/>

  <!-- Iconic Pure White Orca Eye-Patch inside screen -->
  <path d="M 570 380 C 630 350 700 365 720 410 C 730 435 710 465 670 485 C 620 510 560 480 550 440 C 545 410 550 390 570 380 Z" fill="#ffffff"/>

  <!-- Dual Casting Waves in Screen Upper-Right -->
  <path d="M 680 270 A 90 90 0 0 1 770 360" fill="none" stroke="url(#fin_glow)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 720 230 A 150 150 0 0 1 830 340" fill="none" stroke="url(#fin_glow)" stroke-width="20" stroke-linecap="round" stroke-opacity="0.6"/>
