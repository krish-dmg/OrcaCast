  <path d="M 660 210 A 240 240 0 0 1 790 450" fill="none" stroke="url(#nord_cyan)" stroke-width="32" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M 730 140 A 340 340 0 0 1 890 480" fill="none" stroke="url(#nord_cyan)" stroke-width="32" stroke-linecap="round" stroke-opacity="0.45"/>

