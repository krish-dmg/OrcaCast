  <!-- Main Continuous Fin Contour -->
  <path d="M 280 720 C 400 720 460 620 500 460 C 530 340 540 200 520 160 C 500 280 420 460 320 580 C 270 640 240 720 280 720 Z" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

